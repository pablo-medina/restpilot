[package]
name = "rp"
version = "0.1.0"
description = "RestPilot — a lightweight desktop REST API client."
authors = ["Pablo Medina"]
license = "MIT"
edition = "2021"

[lib]
name = "rp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "charset", "http2", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.9.1", features = [] }
tokio = { version = "1.48.0", features = ["macros", "time"] }
dirs = "6.0.0"
