[package]
name = "rp"
version = "0.1.0"
description = "RestPilot — a lightweight desktop REST API client."
authors = ["Pablo Medina"]
license = "MIT"
edition = "2021"

[lib]
name = "rp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = ["native-tls", "charset", "http2", "multipart", "stream", "system-proxy"] }
winreg = "0.55"
urlencoding = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.9.1", features = [] }
tokio = { version = "1.48.0", features = ["macros", "net", "time"] }
dirs = "6.0.0"
futures-util = "0.3.31"
base64 = "0.22.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
# Vendored libcurl with NTLM (system/vcpkg builds often lack it → curl error 4).
curl = { version = "0.4.49", default-features = false, features = ["static-curl", "ssl", "ntlm"] }
rquickjs = "0.12.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Networking_WinHttp", "Win32_Foundation"] }
