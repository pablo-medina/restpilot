<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestPilot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Splash only — first paint, before any JS bundle. App layout is in styles.css. */
      html {
        color-scheme: light;
      }
      body.is-booting {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f0efec;
      }
      html[data-theme="dark"] body.is-booting {
        background: #141312;
      }
      body.is-booting #app {
        display: none !important;
      }
      .app-boot-card {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        border: 1px solid rgba(52, 48, 42, 0.14);
        border-radius: 10px;
        background: rgba(255, 252, 246, 0.98);
        box-shadow: 0 10px 28px rgba(28, 27, 25, 0.1);
        color: #4a4540;
        font: 12px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        white-space: nowrap;
      }
      html[data-theme="dark"] .app-boot-card {
        border-color: rgba(236, 231, 220, 0.12);
        background: rgba(26, 25, 23, 0.98);
        color: #c8c2b8;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
      }
      .app-boot-spinner {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(61, 127, 111, 0.22);
        border-top-color: #3d7f6f;
        border-radius: 50%;
        animation: rp-boot-spin 0.65s linear infinite;
      }
      @keyframes rp-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="is-booting">
    <div id="app-boot" class="app-boot-card" role="status" aria-live="polite" aria-busy="true">
      <span class="app-boot-message">Loading... Please wait.</span>
      <div class="app-boot-spinner" aria-hidden="true"></div>
    </div>
    <div id="app" class="app-frame" hidden></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
