<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RestPilot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f0efec;
        color: #1c1b19;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }
      html[data-theme="dark"] body {
        background: #141312;
        color: #ece7dc;
      }
      #app {
        min-height: 100vh;
      }
      #app.app-frame {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        grid-template-rows: 32px minmax(0, 1fr);
        grid-template-areas:
          "rail titlebar"
          "rail main";
        height: 100vh;
        overflow: hidden;
      }
      .title-bar {
        display: flex;
        grid-area: titlebar;
        align-items: center;
        justify-content: center;
        height: 32px;
        border-bottom: 1px solid #dedad4;
        background: #f4f3f0;
        font-size: 12px;
        color: #8f8983;
      }
      html[data-theme="dark"] .title-bar {
        border-bottom-color: #2a2825;
        background: #1a1917;
        color: #9a948b;
      }
      .shell {
        display: grid;
        grid-area: main;
        grid-template-columns: minmax(0, 260px) minmax(0, 1fr);
        min-height: 0;
      }
      .shell.shell--activity-bar.is-collection-collapsed,
      .shell.shell--activity-bar:has(.collection-sidebar.is-collapsed) {
        grid-template-columns: minmax(0, 1fr);
      }
      .activity-bar {
        display: flex;
        grid-area: rail;
        flex-direction: column;
        width: 48px;
        padding: 0;
        border-right: 1px solid #dedad4;
        background: #f4f3f0;
      }
      html[data-theme="dark"] .activity-bar,
      html[data-theme="dark"] .collection-sidebar {
        border-right-color: #2a2825;
        background: #181715;
      }
      .activity-item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        color: #6f6a62;
      }
      .activity-brand-logo {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      .activity-bar-spacer {
        flex: 1;
      }
      .collection-sidebar {
        width: 260px;
        min-width: 0;
        padding: 14px;
        border-right: 1px solid rgba(52, 48, 42, 0.1);
        background: rgba(255, 252, 246, 0.72);
      }
      .collection-sidebar.is-collapsed {
        display: none;
      }
      .collection-search-field {
        display: flex;
        align-items: center;
        height: 32px;
        margin-bottom: 10px;
        padding: 0 8px;
        border: 1px solid rgba(52, 48, 42, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.55);
        color: #8b857c;
      }
      html[data-theme="dark"] .collection-search-field {
        border-color: rgba(236, 231, 220, 0.12);
        background: rgba(26, 25, 23, 0.88);
        color: #8a847c;
      }
      .tree-skeleton {
        min-height: 120px;
        border-radius: 6px;
        background: rgba(52, 48, 42, 0.06);
      }
      html[data-theme="dark"] .tree-skeleton {
        background: rgba(255, 255, 255, 0.04);
      }
      .workspace {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #f6f4ef;
      }
      html[data-theme="dark"] .workspace {
        background: #141312;
      }
      .workspace-skeleton {
        flex: 1;
        margin: 12px;
        border: 1px solid rgba(52, 48, 42, 0.1);
        border-radius: 8px;
        background: rgba(255, 252, 246, 0.72);
      }
      html[data-theme="dark"] .workspace-skeleton {
        border-color: rgba(236, 231, 220, 0.1);
        background: #22211e;
      }
    </style>
    <script>
      (function () {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
        <div id="app" class="app-frame">
      <nav class="activity-bar" aria-hidden="true">
        <span class="activity-item"><img class="activity-brand-logo" src="/favicon.svg" width="28" height="28" alt="" /></span>
        <span class="activity-item" style="opacity: 0.35">···</span>
        <span class="activity-bar-spacer"></span>
        <span class="activity-item" style="opacity: 0.35">⚙</span>
      </nav>
      <header class="title-bar" aria-hidden="true">RestPilot</header>
      <main class="shell shell--activity-bar" aria-busy="true" aria-label="Loading RestPilot">
        <aside class="collection-sidebar" aria-hidden="true">
          <div class="collection-search-field">Search collection</div>
          <div class="tree-skeleton"></div>
        </aside>
        <section class="workspace">
          <div class="workspace-skeleton" aria-hidden="true"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
